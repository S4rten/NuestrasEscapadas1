name: Compilar App iOS (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15-intel

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode (.xcodeproj)
        run: xcodegen generate

      - name: Resolver paquetes de Firebase
        run: xcodebuild -resolvePackageDependencies -project NuestrasEscapadas.xcodeproj -scheme NuestrasEscapadas

      - name: Compilar aplicacion sin firma de desarrollador
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project NuestrasEscapadas.xcodeproj \
            -scheme NuestrasEscapadas \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log || {
              echo "=== ERRORES EXACTOS DE SWIFT ==="
              grep -n "error:" build.log || true
              exit 1
            }

      - name: Empaquetar archivo .ipa instalable
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NuestrasEscapadas.app Payload/
          zip -r NuestrasEscapadas.ipa Payload

      - name: Subir .ipa listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: NuestrasEscapadas-iOS
          path: NuestrasEscapadas.ipa
